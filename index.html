<!DOCTYPE html>
<html>

<head>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Lb2_CSS</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .task-list {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            margin: 0 auto;
             width: fit-content;
            background: linear-gradient(60deg, #e702ee, #1d0238);
            border-radius: 4px;
          padding: 20px;
        }

        .task-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #3a0640;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
            vertical-align: middle;
            transition: background-color 0.3s;
        }

        .task-checkbox:checked {
            background-color: #b70ea9;
            border-color: #b70ea9;
        }

        .task-checkbox:checked::after {
            display: block;
            color: white;
            text-align: center;
            line-height: 16px;
            font-size: 15px;
        }

        .task-checkbox+label {
            color: white;
            cursor: pointer;
        }

        a[target="_blank"] {
            color: white;
        }
    </style>
</head>

<body>
    <header>
        <h3  style = "color: #ca5f9c; text-align: center">Laborator work 2</h3> <!--inline-->
        <nav class="navigation">
            <a href="#tasks">Tasks</a>
            <a href="#flexbox">Flexbox</a>
            <a href="#sources">Sources</a>
        </nav>
    </header>
    <main>
        <section id="tasks">
            <h2>Tasks</h2>
            <div class="task-list">
                <div>
                    <input class="task-checkbox" type="checkbox" id="task1">
                    <label for="task1">1.Додати на сторінку кілька елементів checkbox, оформлення яких залежить від
                        стану.
                    </label>
                </div>
                <div>
                    <input class="task-checkbox" type="checkbox" id="task2">
                    <label for="task2">2.Додати на сторінку контейнер з елементами, розміщеними згідно з
                        малюнком.</label>
                </div>
            </div>
        </section>
        <section id="flexbox">
            <h2>Flexbox</h2>

            <div class="flex-container">
                <div class="square">1</div>
                <div class="square">2</div>
                <div class="square">3</div>
                <div class="square">4</div>
                <div class="square">5</div>
                <div class="square">6</div>
                <div class="square">7</div>
                <div class="square">8</div>

                <div class="long-item">9</div>
            </div>
        </section>
        <section id="sources">
            <p>
                Посилання на репозиторій:
                <a href="https://github.com/disvrr/WEB_dev-lb2" target="_blank">
                    GitHub
                </a>
            </p>
        </section>
    </main>
    <footer>
        <p>Diana Ivakhnenko</p>
    </footer>
</body>

</html>
